<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" font-family="Public Sans, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16191b"/></marker>
  </defs>
  <rect width="600" height="640" fill="#d3d5d0"/>
  <!-- sea track -->
  <line x1="330" y1="40" x2="330" y2="610" stroke="#9da19b" stroke-width="1.5" stroke-dasharray="4 6"/>
  <text x="338" y="54" fill="#474d52" font-size="12">ship's heading (BRC)</text>
  <!-- carrier -->
  <g transform="translate(330 280)">
    <path d="M-9 50 L-9 -38 L0 -52 L9 -38 L9 50 Z" fill="#2b3035"/>
    <line x1="-6" y1="48" x2="2" y2="-4" stroke="#f2b705" stroke-width="2"/>
  </g>
  <!-- initial up the starboard side -->
  <path d="M352 600 L352 228" fill="none" stroke="#16191b" stroke-width="3" marker-end="url(#ar)"/>
  <!-- break -->
  <path d="M352 220 A 97 97 0 0 0 158 220" fill="none" stroke="#16191b" stroke-width="3"/>
  <!-- downwind -->
  <path d="M158 220 L158 338" fill="none" stroke="#16191b" stroke-width="3" marker-end="url(#ar)"/>
  <!-- final turn -->
  <path d="M158 342 C 158 470, 330 500, 343 418" fill="none" stroke="#16191b" stroke-width="3"/>
  <!-- groove -->
  <path d="M343 418 L 330 336" fill="none" stroke="#b0301b" stroke-width="4" marker-end="url(#ar)"/>
  <!-- labels -->
  <circle cx="352" cy="560" r="5" fill="#16191b"/>
  <text x="366" y="556" font-weight="700">Initial</text>
  <text x="366" y="574" fill="#474d52">3 nm astern, 800 ft, 350 kt</text>
  <circle cx="352" cy="210" r="5" fill="#16191b"/>
  <text x="372" y="196" font-weight="700">Break</text>
  <text x="372" y="214" fill="#474d52">over or past the bow,</text>
  <text x="372" y="232" fill="#474d52">left turn, level at 800 ft</text>
  <text x="24" y="250" font-weight="700">Downwind</text>
  <text x="24" y="268" fill="#474d52">600 ft</text>
  <text x="24" y="286" fill="#474d52">1.1 to 1.3 nm</text>
  <text x="24" y="304" fill="#474d52">abeam the ship</text>
  <text x="24" y="322" fill="#474d52">gear, flaps, hook</text>
  <circle cx="158" cy="338" r="5" fill="#16191b"/>
  <text x="24" y="362" font-weight="700">Abeam</text>
  <text x="24" y="380" fill="#474d52">start the turn</text>
  <circle cx="198" cy="452" r="5" fill="#16191b"/>
  <text x="120" y="494" font-weight="700">The 90</text>
  <text x="120" y="512" fill="#474d52">450 ft</text>
  <circle cx="300" cy="470" r="5" fill="#16191b"/>
  <text x="256" y="512" font-weight="700">The 45</text>
  <text x="256" y="530" fill="#474d52">about 350 ft</text>
  <text x="358" y="410" font-weight="700" fill="#b0301b">Groove</text>
  <text x="358" y="428" fill="#474d52">15 to 18 seconds,</text>
  <text x="358" y="446" fill="#474d52">fly the ball, lineup, AoA</text>
  <!-- scale -->
  <line x1="40" y1="600" x2="140" y2="600" stroke="#16191b" stroke-width="2"/>
  <line x1="40" y1="594" x2="40" y2="606" stroke="#16191b" stroke-width="2"/>
  <line x1="140" y1="594" x2="140" y2="606" stroke="#16191b" stroke-width="2"/>
  <text x="40" y="624" fill="#474d52" font-size="12">about 1 nm (not to scale near the ship)</text>
</svg>
